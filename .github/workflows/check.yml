name: Code Quality Checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: code-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          pip install pyyaml
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20 clang-format clang-tidy

      - name: Run code quality checks
        run: python3 scripts/check.py --json
